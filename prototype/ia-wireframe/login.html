<!DOCTYPE html>
<!--
  Paper30Min 一次性 UI 原型（登录初始界面，#44 后续美化任务）
  问题：未来云端账号的登录初始界面长什么样？约定：底色与正式页面一致、登录输入栏在右侧、
  左侧为复杂三维动态图案（候选三种，作者选型）。
  ?v=1 粒子神经球 | ?v=2 环面纽结流光 | ?v=3 粒子浪潮；底部悬浮条或 ←/→ 键切换。
  纯 Canvas 2D 伪三维投影，零依赖，双击即开。不是正式实现，不合入主线。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录页原型 · Paper30Min</title>
<style>
:root {
  --bg: #f8fafc; --card:#ffffff; --border:#e8ecf4; --text:#1e293b;
  --muted:#64748b; --accent:#6366f1; --accent2:#ec4899; --accent3:#10b981;
  --accent-soft:#eef2ff;
  --shadow: 0 10px 30px -12px rgba(30,41,59,.12);
  --shadow-lg: 0 16px 40px -12px rgba(99,102,241,.22);
}
* { box-sizing:border-box; }
body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
.stage { display:flex; height:100vh; }

/* 左侧三维动画区 */
.scene { flex:1; position:relative; overflow:hidden; }
#cv { position:absolute; inset:0; }
.scene-copy { position:absolute; left:56px; bottom:56px; pointer-events:none; }
.scene-copy h1 { font-size:34px; margin:0 0 8px; letter-spacing:.5px;
  background:linear-gradient(120deg,#4f46e5,#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent; }
.scene-copy p { margin:0; color:var(--muted); font-size:14.5px; }
.proto-tag { position:absolute; top:22px; left:26px; font-size:12px; color:#b7791f;
  border:1px dashed #b7791f; border-radius:6px; padding:2px 8px; background:rgba(255,255,255,.6); }
.back-link { position:absolute; top:20px; right:24px; font-size:13px; color:var(--muted);
  text-decoration:none; background:rgba(255,255,255,.7); border:1px solid var(--border);
  padding:6px 12px; border-radius:999px; backdrop-filter:blur(8px); }
.back-link:hover { color:var(--accent); border-color:var(--accent); }

/* 右侧登录栏 */
.login-side { width:430px; flex:none; background:var(--card); height:100vh;
  box-shadow:-14px 0 44px -18px rgba(30,41,59,.18); display:flex; align-items:center; }
.login-card { width:100%; padding:0 52px; }
.logo { width:54px; height:54px; border-radius:18px; margin-bottom:22px;
  background:linear-gradient(135deg,#6366f1,#ec4899); color:#fff; font-weight:800; font-size:19px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px -8px rgba(99,102,241,.55); }
.login-card h2 { font-size:24px; margin:0 0 6px; font-weight:700; }
.login-card > p { margin:0 0 26px; color:var(--muted); font-size:13.5px; line-height:1.6; }
.field { display:block; margin-bottom:16px; }
.field span { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
.field input { width:100%; padding:13px 16px; font-size:14.5px; color:var(--text);
  background:#f1f5f9; border:0; border-radius:14px; outline:none; transition:all .22s ease; }
.field input:focus { background:#fff; box-shadow:0 0 0 3px rgba(99,102,241,.18); }
.btn-login { width:100%; margin-top:8px; padding:13px 0; border:0; border-radius:14px;
  background:var(--accent); color:#fff; font-size:15.5px; font-weight:600; cursor:pointer;
  box-shadow:0 10px 24px -8px rgba(99,102,241,.55); transition:all .22s ease; }
.btn-login:hover { background:#4f46e5; transform:translateY(-1px); box-shadow:var(--shadow-lg); }
.btn-login:active { transform:scale(.97); box-shadow:inset 0 2px 6px rgba(30,41,59,.2); }
.divider { display:flex; align-items:center; gap:12px; margin:22px 0 14px; color:#cbd5e1; font-size:12px; }
.divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--border); }
.btn-solo { width:100%; padding:12px 0; border:1px solid var(--border); border-radius:14px;
  background:transparent; color:var(--muted); font-size:14px; cursor:pointer; transition:all .2s ease; }
.btn-solo:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.fine { margin-top:20px; font-size:12px; color:#94a3b8; line-height:1.7; }

/* 悬浮变体切换条 */
.switcher { position:fixed; bottom:18px; left:calc((100% - 430px)/2); transform:translateX(-50%); z-index:9;
  display:flex; align-items:center; gap:12px; background:#1e293b; color:#fff; border-radius:999px;
  padding:8px 14px; box-shadow:0 6px 24px rgba(0,0,0,.3); font-size:13.5px; }
.switcher button { border:0; background:rgba(255,255,255,.14); color:#fff; width:28px; height:28px;
  border-radius:50%; font-size:15px; cursor:pointer; }
.switcher button:hover { background:var(--accent); }
.switcher .vname { min-width:150px; text-align:center; }
.switcher .vname b { color:#a5b4fc; }
</style>
</head>
<body>
<div class="stage">
  <section class="scene">
    <canvas id="cv"></canvas>
    <span class="proto-tag">原型 · 一次性</span>
    <a class="back-link" href="index.html?variant=B">← 阅读界面原型</a>
    <div class="scene-copy">
      <h1>Paper30Min</h1>
      <p>把论文读薄 —— 30 分钟讲清问题、方法、证据与边界</p>
    </div>
  </section>
  <aside class="login-side">
    <div class="login-card">
      <div class="logo">30</div>
      <h2>欢迎回来</h2>
      <p>登录云端账号，同步移动阅读副本与阅读位置。</p>
      <label class="field"><span>服务器</span><input value="https://sync.paper30min.example" spellcheck="false"></label>
      <label class="field"><span>账号</span><input placeholder="由管理员创建的账号" spellcheck="false"></label>
      <label class="field"><span>密码</span><input type="password" placeholder="••••••••"></label>
      <button class="btn-login">登 录</button>
      <div class="divider">或</div>
      <button class="btn-solo">暂不登录，独立运行 →</button>
      <p class="fine">独立运行可使用本地书库与全部本地能力，无需联网账号。<br>账号由管理员创建，不开放公开注册。</p>
    </div>
  </aside>
</div>

<div class="switcher">
  <button onclick="cycle(-1)">‹</button>
  <span class="vname" id="vname"></span>
  <button onclick="cycle(1)">›</button>
</div>

<script>
/* ================= Canvas 伪三维引擎 ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0, H=0;
function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

let mx=0, my=0, tmx=0, tmy=0;
addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  tmx = (e.clientX-r.left-r.width/2)/r.width;
  tmy = (e.clientY-r.top-r.height/2)/r.height;
});

const rotY = (p,a)=>{ const c=Math.cos(a),s=Math.sin(a); return {x:p.x*c+p.z*s, y:p.y, z:-p.x*s+p.z*c}; };
const rotX = (p,a)=>{ const c=Math.cos(a),s=Math.sin(a); return {x:p.x, y:p.y*c-p.z*s, z:p.y*s+p.z*c}; };
const lerp = (a,b,t)=>a+(b-a)*t;
/* 三色渐变：indigo → pink → emerald */
const C1=[99,102,241], C2=[236,72,153], C3=[16,185,129];
function grad(t){ t=((t%1)+1)%1;
  const [a,b,k] = t<.5 ? [C1,C2,t*2] : [C2,C3,(t-.5)*2];
  return `rgb(${Math.round(lerp(a[0],b[0],k))},${Math.round(lerp(a[1],b[1],k))},${Math.round(lerp(a[2],b[2],k))})`;
}

/* ---------- 变体 1：粒子神经球 ---------- */
const sphere = (()=>{ const N=380, pts=[], R=1;
  for(let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=i*2.399963;
    pts.push({x:Math.cos(th)*r*R, y:y*R, z:Math.sin(th)*r*R}); }
  const links=[];
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;
    if(dx*dx+dy*dy+dz*dz<0.115) links.push([i,j]);
  }
  return {pts, links};
})();

/* ---------- 变体 2：环面纽结 ---------- */
const knot = (()=>{ const N=760, pts=[], p=2, q=3;
  for(let i=0;i<N;i++){ const t=i/N*Math.PI*2;
    const r=1+0.45*Math.cos(q*t);
    pts.push({x:r*Math.cos(p*t), y:r*Math.sin(p*t), z:0.45*Math.sin(q*t), t:i/N});
  }
  return pts;
})();

/* ---------- 变体 3：粒子浪潮 ---------- */
const wave = (()=>{ const GX=72, GZ=44, pts=[];
  for(let ix=0;ix<GX;ix++) for(let iz=0;iz<GZ;iz++)
    pts.push({x:(ix/(GX-1)-.5)*3.4, z:(iz/(GZ-1)-.5)*2.2, ix, iz});
  return pts;
})();

const VARIANTS = { '1':'粒子神经球', '2':'环面纽结流光', '3':'粒子浪潮' };
function getV(){ const v=new URLSearchParams(location.search).get('v'); return VARIANTS[v]?v:'1'; }
function cycle(d){ const ks=Object.keys(VARIANTS); const i=(ks.indexOf(getV())+d+ks.length)%ks.length;
  history.replaceState(null,'','?v='+ks[i]); label(); }
function label(){ const v=getV(); document.getElementById('vname').innerHTML=`<b>${v}</b> ${VARIANTS[v]}`; }
document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1); });

let t0 = performance.now();
function frame(now){
  const t = (now-t0)/1000;
  mx = lerp(mx, tmx, .045); my = lerp(my, tmy, .045);
  ctx.clearRect(0,0,W,H);
  /* 柔和底光 */
  const g = ctx.createRadialGradient(W*.42,H*.42,0, W*.42,H*.42, Math.max(W,H)*.62);
  g.addColorStop(0,'rgba(99,102,241,.075)'); g.addColorStop(.55,'rgba(236,72,153,.04)'); g.addColorStop(1,'rgba(248,250,252,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const cx=W*.46, cy=H*.44, S=Math.min(W,H)*0.30*(1+0.025*Math.sin(t*.5));
  const f = 3.1;
  const aY = t*.14 + mx*.9, aX = .32 + my*.6;
  const v = getV();

  if(v==='1'){
    const P = sphere.pts.map(p=>{
      let q = rotY(p, aY); q = rotX(q, aX);
      const s = f/(f+q.z);
      return {sx:cx+q.x*S*s, sy:cy+q.y*S*s, s, z:q.z};
    });
    ctx.lineWidth=1;
    for(const [i,j] of sphere.links){
      const a=(P[i].s+P[j].s-1.4)*.55;
      if(a<=0.02) continue;
      ctx.strokeStyle=`rgba(99,102,241,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(P[i].sx,P[i].sy); ctx.lineTo(P[j].sx,P[j].sy); ctx.stroke();
    }
    for(let i=0;i<P.length;i++){
      const p=P[i], r=Math.max(.8,(p.s-.5)*3.2);
      ctx.fillStyle=grad(i/P.length + t*.02);
      ctx.globalAlpha=Math.min(1,(p.s-.5)*1.5);
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(v==='2'){
    const P = knot.map(p=>{
      let q = rotY(p, aY*1.25); q = rotX(q, aX+.5);
      const s = f/(f+q.z);
      return {sx:cx+q.x*S*.78*s, sy:cy+q.y*S*.78*s, s, t:p.t};
    });
    ctx.lineCap='round';
    for(let i=1;i<P.length;i++){
      const a=P[i-1], b=P[i], depth=(a.s+b.s)/2;
      /* 宽而淡的辉光层 + 细而亮的主线 */
      ctx.strokeStyle=grad(b.t); ctx.globalAlpha=Math.max(0,(depth-.62))*.34;
      ctx.lineWidth=Math.max(1,(depth-.5)*9);
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
      ctx.globalAlpha=Math.min(1,Math.max(.08,(depth-.58)*1.35));
      ctx.lineWidth=Math.max(.6,(depth-.5)*2.6);
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  if(v==='3'){
    const tilt=.95+my*.35, sway=Math.sin(t*.1)*.25+mx*.7;
    for(const p of wave){
      const y = .22*Math.sin(p.x*2.6+t*1.25)*Math.cos(p.z*3.1+t*.9)
              + .07*Math.sin(p.x*5.2 - t*1.9);
      let q = rotX({x:p.x, y, z:p.z}, tilt); q = rotY(q, sway);
      const s = f/(f+q.z);
      const sx=cx+q.x*S*1.15*s, sy=cy+q.y*S*1.6*s - H*.02;
      const hN=(y+.3)/.6;
      ctx.fillStyle=grad(hN*.8 + t*.015);
      ctx.globalAlpha=Math.min(1,Math.max(.1,(s-.52)*1.6));
      ctx.beginPath(); ctx.arc(sx,sy,Math.max(.5,(s-.5)*2.3),0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
label();
requestAnimationFrame(frame);
</script>
</body>
</html>
