name: Electron CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: v2 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 验证真实桌面行为；Linux 仅验证类型和构建。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      PAPER30MIN_TEST_WINDOW: hidden
    steps:
      - uses: actions/checkout@v4
        with:
          # floor-guard 需要 merge-base 与完整分支差异。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install pinned security scanners
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Fast constraints
        run: npm run check:fast

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Dependency vulnerabilities
        run: npm run check:dependencies

      # build 已包含 typecheck；先构建一次，再直接运行 Playwright。
      - name: Typecheck and build
        run: npm run build

      - name: Run Windows Electron tests
        if: runner.os == 'Windows'
        run: npx playwright test --reporter=list,html

      - name: Upload test evidence
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-evidence-${{ matrix.os }}
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
          if-no-files-found: warn
