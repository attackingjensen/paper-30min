name: Electron CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: v2 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 验证真实桌面行为；Linux 仅验证类型和构建。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      PAPER30MIN_TEST_WINDOW: hidden
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build 已包含 typecheck；先构建一次，再直接运行 Playwright。
      - name: Typecheck and build
        run: npm run build

      - name: Run Windows Electron tests
        if: runner.os == 'Windows'
        run: npx playwright test --reporter=list,html

      - name: Upload test evidence
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-evidence-${{ matrix.os }}
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
          if-no-files-found: warn
